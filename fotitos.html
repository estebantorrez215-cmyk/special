<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Our Memories</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(180deg, #f8e1e7, #fdeff4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Playfair Display', serif;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 360px;
            text-align: center;
        }

        .music-choice {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 25px;
        }

        .choice-btn {
            padding: 12px 26px;
            font-size: 16px;
            border: none;
            border-radius: 40px;
            background: linear-gradient(45deg, #ff9aa2, #ffb7c5);
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .choice-btn.active {
            background: linear-gradient(45deg, #ff6b81, #ff9aa2);
        }

        .start-btn {
            padding: 14px 40px;
            font-size: 20px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(45deg, #ff6b81, #ff9aa2);
            color: white;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
        }

        .carousel {
            width: 100%;
            height: 420px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: none;
            background: #fdeff4;
        }

       .carousel img {
        width: 100%;
        height: 100%;
        object-fit: contain; 
        object-position: center;
        transition: opacity 1s ease;
        background: #fdeff4; 
    }
    </style>
</head>
<body>

<!-- Audios -->
<audio id="musicMe" loop>
    <source src="yo.mp3" type="audio/mpeg">
</audio>

<audio id="musicOriginal" loop>
    <source src="WhoKnows.mp3" type="audio/mpeg">
</audio>

<div class="container">

    <!-- Elección de música -->
    <div class="music-choice">
        <button id="meBtn" class="choice-btn">Me</button>
        <button id="originalBtn" class="choice-btn">Original</button>
    </div>

    <!-- Start -->
    <button id="startBtn" class="start-btn">
        Start
    </button>

    <!-- Carrusel -->
    <div id="carousel" class="carousel">
        <img id="carouselImg" src="" alt="memory">
    </div>
    <button id="backBtn" class="start-btn" style="margin-top: 20px; background: linear-gradient(45deg, #6b6bff, #8e8eff);">
        Back
    </button>
</div>

<script>
    const images = [
        "https://i.pinimg.com/736x/d8/ca/aa/d8caaa7cd77356268573194f05821e60.jpg",

    ];

     const meBtn = document.getElementById("meBtn");
    const originalBtn = document.getElementById("originalBtn");
    const startBtn = document.getElementById("startBtn");
    const carousel = document.getElementById("carousel");
    const img = document.getElementById("carouselImg");

    const musicMe = document.getElementById("musicMe");
    const musicOriginal = document.getElementById("musicOriginal");

    let chosenMusic = null;
    let index = 0;
    let started = false;

    function stopAllMusic() {
        musicMe.pause();
        musicOriginal.pause();
    }

    meBtn.addEventListener("click", () => {
        stopAllMusic();
        chosenMusic = musicMe;
        musicMe.play().catch(() => {});
        meBtn.classList.add("active");
        originalBtn.classList.remove("active");
    });

    originalBtn.addEventListener("click", () => {
        stopAllMusic();
        chosenMusic = musicOriginal;
        musicOriginal.play().catch(() => {});
        originalBtn.classList.add("active");
        meBtn.classList.remove("active");
    });

    function startCarousel() {
        img.src = images[index];

        setInterval(() => {
            img.style.opacity = 0;

            setTimeout(() => {
                index = (index + 1) % images.length;
                img.src = images[index];
                img.style.opacity = 1;
            }, 500);

        }, 2000);
    }

    startBtn.addEventListener("click", () => {
        if (!chosenMusic) {
            alert("Choose a song first ♡");
            return;
        }

        if (!started) {
            started = true;
            startBtn.style.display = "none";
            carousel.style.display = "block";
            startCarousel();
        }
    });
    const backBtn = document.getElementById("backBtn");
backBtn.addEventListener("click", () => {
    window.location.href = "sanvalentin.html";
});
</script>

</body>
</html>
